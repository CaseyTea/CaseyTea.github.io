<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b09" />
    <title>Page not found | Casey Franceschy</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #070b09;
        color: #f2ede3;
      }

      body {
        display: grid;
        min-block-size: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        inline-size: min(36rem, calc(100% - 3rem));
        border: 1px solid #263a2f;
        border-radius: 1rem;
        background: #0d1511;
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 28%);
        padding: clamp(1.5rem, 5vw, 3rem);
      }

      p {
        color: #a9b0a7;
        line-height: 1.6;
      }

      a {
        color: #070b09;
        background: #72d6a0;
        border-radius: 0.55rem;
        display: inline-block;
        font-weight: 700;
        margin-block-start: 0.75rem;
        padding: 0.7rem 1rem;
        text-decoration: none;
      }

      a:focus-visible,
      a:hover {
        background: #9be7b8;
        outline: 3px solid #b8f3cd;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>Page not found</h1>
      <p>The page you requested does not exist or may have moved.</p>
      <a href="/">Return to Casey Franceschy&rsquo;s portfolio</a>
    </main>
  </body>
</html>
